<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Webserver Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f7f6; }
        pre { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Cloudflare Pages Webserver</h1>
    <p>Dữ liệu tải lên từ endpoint: <code>/servers/servers.json</code></p>
    <pre id="json-output">Đang tải dữ liệu...</pre>

    <script>
        // Tự động gọi API nội bộ khi trang web được tải
        fetch('/servers/servers.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('json-output').textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('json-output').textContent = 'Lỗi tải API: ' + err;
            });
    </script>
</body>
</html>
